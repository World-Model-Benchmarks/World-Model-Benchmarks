name: Repair PDF benchmark alignment

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pdf-alignment-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'World-Model-Benchmarks/World-Model-Benchmarks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Stop when main is already aligned
        id: current
        shell: bash
        run: |
          set -euo pipefail
          if python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/assets/benchmarks.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          ok=m.get('schemaVersion',0)>=8 and bool(m.get('sourcePdfSha256'))
          raise SystemExit(0 if ok else 1)
          PY
          then
            echo 'aligned=true' >> "$GITHUB_OUTPUT"
          else
            echo 'aligned=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Download the validated correction snapshot
        if: steps.current.outputs.aligned != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/World-Model-Benchmarks-PDF-aligned.zip
          checksum=/tmp/World-Model-Benchmarks-PDF-aligned.zip.sha256
          curl --fail --location --retry 10 --retry-all-errors -A 'Mozilla/5.0 GitHub-Actions' \
            'https://filebin.net/oai-wmb-pdf-align-20260901-8f4c7e19/World-Model-Benchmarks-PDF-aligned.zip' -o "$archive"
          curl --fail --location --retry 10 --retry-all-errors -A 'Mozilla/5.0 GitHub-Actions' \
            'https://filebin.net/oai-wmb-pdf-align-20260901-8f4c7e19/World-Model-Benchmarks-PDF-aligned.zip.sha256' -o "$checksum"
          cd /tmp
          sha256sum --check "$(basename "$checksum")"
          rm -rf /tmp/pdf-aligned
          mkdir /tmp/pdf-aligned
          unzip -q "$archive" -d /tmp/pdf-aligned
          SOURCE=$(find /tmp/pdf-aligned -type f -name benchmarks.json -path '*/docs/assets/benchmarks.json' -printf '%h/../..\n' | head -n 1)
          SOURCE=$(realpath "$SOURCE")
          test -f "$SOURCE/Readme.md"
          echo "$SOURCE" > /tmp/source-path

      - name: Apply every corrected source and generated output
        if: steps.current.outputs.aligned != 'true'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=$(cat /tmp/source-path)
          paths=(
            '.github/workflows/generate-readme.yml'
            'Readme.md'
            'docs/assets/benchmarks.json'
            'docs/assets/benchmarks-1.json'
            'docs/assets/benchmarks-2.json'
            'docs/assets/benchmarks-3.json'
            'docs/assets/benchmarks-4.json'
            'docs/assets/metadata.json'
            'docs/index.html'
            'docs/assets/app-v3-core.js'
            'docs/assets/app-v3.js'
            'docs/robots.txt'
            'docs/sitemap.xml'
            'docs/deployment-status.txt'
            'docs/assets/social-preview.svg'
            'scripts/generate_readme_index.py'
            'scripts/sync_latest_survey.py'
          )
          for path in "${paths[@]}"; do
            test -f "$SOURCE/$path"
            mkdir -p "$(dirname "$path")"
            cp "$SOURCE/$path" "$path"
          done

      - name: Validate aligned state
        if: steps.current.outputs.aligned != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/generate_readme_index.py scripts/sync_latest_survey.py
          python scripts/generate_readme_index.py
          python scripts/sync_latest_survey.py
          node --check docs/assets/app-v3-core.js
          node --check docs/assets/app-v3.js
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('docs/assets/benchmarks.json').read_text(encoding='utf-8'))
          assert m.get('schemaVersion',0)>=8 and m.get('sourcePdfSha256')
          assert len(m['records'])==m['total']
          assert sum(len([x for x in r[6].split('+') if x])>1 for r in m['records'].values())==m['crossCategory']
          for r in m['records'].values():
              assert set(filter(None,r[3].split('+'))) <= {'OL','CL'}
              assert set(filter(None,r[4].split('+'))) <= {'P','O'}
              assert set(filter(None,r[5].split('+'))) <= {'RWD','SBG','SPTC','HCP'}
          PY

      - name: Commit corrections or remove completed repair workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pdf-alignment-repair.yml
          git config user.name 'world-model-benchmarks-bot'
          git config user.email 'world-model-benchmarks-bot@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Complete latest-PDF benchmark taxonomy alignment'
            git push origin HEAD:main
          fi
