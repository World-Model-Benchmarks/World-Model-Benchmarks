name: Deploy survey project page

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "scripts/test_website_domains.cjs"
      - "scripts/test_release_years.cjs"
      - "scripts/test_target_scoped_metrics.cjs"
      - "scripts/target_scoped_coding.py"
      - "scripts/sync_latest_survey.py"
      - "scripts/release_years_20260907.json"
      - "scripts/verify_live_release_years.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate target-specific metrics, release years and website domains
        run: |
          python scripts/sync_latest_survey.py
          node --check docs/assets/app-v3-core.js
          node --check docs/assets/app-v3.js
          node scripts/test_website_domains.cjs
          node scripts/test_release_years.cjs
          node scripts/test_target_scoped_metrics.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
