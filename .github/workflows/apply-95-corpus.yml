name: Apply 95-benchmark manuscript snapshot

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/migrate_95_data.py"
      - "scripts/migrate_95_site.py"
      - ".github/workflows/apply-95-corpus.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-95-corpus
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply canonical data migration
        run: python scripts/migrate_95_data.py

      - name: Update website and README
        run: python scripts/migrate_95_site.py

      - name: Validate snapshot
        run: python scripts/sync_latest_survey.py

      - name: Commit synchronized snapshot
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Snapshot is already synchronized."
            exit 0
          fi
          git config user.name "axbhb"
          git config user.email "144993397+axbhb@users.noreply.github.com"
          git add Readme.md docs scripts/generate_readme_index.py scripts/sync_latest_survey.py
          git commit -m "Align repository and website with the 95-benchmark survey"
          git push
